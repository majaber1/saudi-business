name: CI

on:
  push:
    branches: [ main, "feat/**" ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Backend tests & smoke import
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest (financial + funding engines)
        run: pytest tests/ -v

      - name: Smoke-import FastAPI app (backend startup)
        working-directory: backend
        env:
          PYTHONPATH: .
        run: |
          python -c "from app.main import app; print('FastAPI app imported OK:', app.title)"

      - name: Smoke-import Vercel serverless entrypoint
        run: python -c "import importlib.util, pathlib, sys; sys.path[:0]=[str(pathlib.Path('backend')), str(pathlib.Path('financial-engine')), str(pathlib.Path('funding-engine'))]; import app.main; print('Vercel entry imports OK')"

  secret-scan:
    name: Basic secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan tracked files for obvious secrets
        run: |
          set -e
          PATTERN='(-----BEGIN [A-Z ]*PRIVATE KEY-----|AKIA[0-9A-Z]{16}|sk-[A-Za-z0-9]{20,}|xox[baprs]-[0-9A-Za-z-]{10,}|ghp_[A-Za-z0-9]{36})'
          if git grep -nIE "$PATTERN" -- . ':(exclude).github/workflows/ci.yml'; then
            echo "::error::Potential secret found in tracked files"; exit 1
          else
            echo "No obvious secrets found."
          fi
